<!DOCTYPE html>
<html>
<head>
<title>Login – Invigilation Allotment System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#1a1a6e 0%,#4a0080 50%,#1a1a6e 100%);display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
body::before{content:'';position:absolute;width:500px;height:500px;background:rgba(255,255,255,0.03);border-radius:50%;top:-100px;left:-100px}
body::after{content:'';position:absolute;width:400px;height:400px;background:rgba(255,255,255,0.03);border-radius:50%;bottom:-80px;right:-80px}
.card{background:rgba(255,255,255,0.97);width:440px;padding:44px 40px;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,0.4);text-align:center;position:relative;z-index:10}
.logo-wrap{width:72px;height:72px;background:linear-gradient(135deg,#4a0080,#1a1a6e);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 24px rgba(74,0,128,0.4)}
.logo-wrap span{font-size:34px}
h2{font-size:22px;color:#1a1a6e;font-weight:800}
.subtitle{color:#888;font-size:13px;margin:4px 0 28px}
.divider{height:1px;background:linear-gradient(to right,transparent,#ddd,transparent);margin:0 0 24px}
.label{text-align:left;font-size:12px;color:#555;margin:14px 0 5px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.input-wrap{position:relative}
input[type="text"],input[type="password"],select{width:100%;padding:12px 16px;border-radius:10px;border:1.8px solid #e8e8f0;font-size:14px;outline:none;transition:all 0.25s;background:#f8f8ff;color:#222;font-family:inherit}
input:focus,select:focus{border-color:#4a0080;background:#fff;box-shadow:0 0 0 4px rgba(74,0,128,0.08)}
input[name="password"]{padding-right:48px}
.eye-btn{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px;color:#aaa;padding:0;line-height:1}
.eye-btn:hover{color:#4a0080}
button[type="submit"]{width:100%;padding:14px;margin-top:22px;background:linear-gradient(135deg,#4a0080,#1a1a6e);color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.25s;box-shadow:0 6px 20px rgba(74,0,128,0.35)}
button[type="submit"]:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(74,0,128,0.45)}
.error-box{background:#fff0f2;color:#c0392b;border:1.5px solid #f5b7b1;border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:16px;text-align:left}
.hint{margin-top:20px;background:#f5f0ff;border:1.5px solid #d8c5ff;border-radius:12px;padding:14px 16px;text-align:left;font-size:12px;color:#555;line-height:2.1}
.hint-title{font-size:12px;font-weight:800;color:#4a0080;margin-bottom:6px;display:block}
code{background:#e8dbff;color:#4a0080;border-radius:4px;padding:1px 7px;font-size:11px;font-family:monospace}
.footer{margin-top:18px;font-size:11px;color:#bbb}
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap"><span>🎓</span></div>
  <h2>Automated Invigilation Allotment System</h2>
  <p class="subtitle">CSE Department · Academic Year 2025-26</p>
  <div class="divider"></div>
  {% if msg %}<div class="error-box">⚠️ {{ msg }}</div>{% endif %}
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, m in messages %}<div class="error-box">⚠️ {{ m }}</div>{% endfor %}
  {% endwith %}
  <form action="/login" method="post">
    <div class="label">👤 Username</div>
    <input type="text" name="username" id="username" placeholder="Enter your username" required autocomplete="username">
    <div id="username-hint" style="font-size:11px;color:#888;margin-top:5px;min-height:16px"></div>
    <div class="label">🔒 Password</div>
    <div class="input-wrap">
      <input type="password" name="password" id="pw" placeholder="Enter your password" required>
      <button type="button" class="eye-btn" onclick="togglePw()" id="eyeBtn">👁</button>
    </div>
    <div class="label">🏷️ Role</div>
    <select name="role" id="role" required onchange="updateHint()">
      <option value="">— Select Role —</option>
      <option value="admin">🛡️ Admin</option>
      <option value="faculty">👨‍🏫 Faculty</option>
    </select>
    <button type="submit">Sign In →</button>
  </form>
  
</div>
<script>
function togglePw(){var f=document.getElementById('pw'),b=document.getElementById('eyeBtn');if(f.type==='password'){f.type='text';b.textContent='🙈';}else{f.type='password';b.textContent='👁';}}

function updateHint(){
  var role = document.getElementById('role').value;
  var hint = document.getElementById('username-hint');
  var inp  = document.getElementById('username');
  if(role === 'faculty'){
   
    inp.placeholder = 'e.g. G. Sandhya  or  A. Sharada';
  } else if(role === 'admin'){
    
    hint.style.color = '#888';
    inp.placeholder = 'Enter your username';
  } else {
    hint.textContent = '';
    inp.placeholder = 'Enter your username';
  }
}
</script>
</body>
</html>
